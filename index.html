<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio de sesion | My Parking Turn</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <main class="screen screen-login">
      <header class="brand-header" aria-label="Marca My Parking Turn">
        <img class="brand-logo" src="assets/img/LOGOMPT.png" alt="Logo My Parking Turn">
        <h1>MY PARKING TURN</h1>
      </header>

      <section class="login-panel" aria-labelledby="login-title">
        <h2 id="login-title">INICIO DE SESION</h2>
        <form id="loginForm" novalidate>

          <label class="field">
            <span>USUARIO</span>
            <input
              id="usuario"
              name="usuario"
              type="text"
              inputmode="numeric"
              autocomplete="username"
              minlength="5"
              maxlength="15"
              pattern="[0-9]{5,15}"
              placeholder="USUARIO"
              required
            >
          </label>

          <label class="field" id="field-contrasena">
            <span>CONTRASEÑA</span>
            <div class="password-wrap">
              <input
                id="contrasena"
                name="contrasena"
                type="password"
                autocomplete="current-password"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                minlength="6"
                placeholder="CONTRASEÑA"
                required
              >
              <button
                id="togglePassword"
                class="eye-btn"
                type="button"
                aria-label="Mostrar contraseña"
                tabindex="-1"
              >👁️</button>
            </div>
          </label>

          <p id="loginMessage" class="form-message" role="alert" aria-live="polite"></p>
          <button class="primary-action" type="submit">INGRESAR</button>
        </form>
      </section>

      <nav class="side-actions" aria-label="Acciones de soporte">
        <a class="side-actions-link" href="pages/soporte/soporte.html?guest=1" id="btnSoporteLogin" aria-label="Ir al formulario de soporte sin iniciar sesión">SOPORTE</a>
      </nav>
    </main>

    <!-- storage.js debe cargarse antes que auth.js -->
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>

    <!-- Ojo: mostrar contraseña mientras se mantiene presionado -->
    <script>
      (function () {
        var btn = document.getElementById('togglePassword');
        var inp = document.getElementById('contrasena');
        if (!btn || !inp) return;

        function show() {
          inp.type = 'text';
          btn.setAttribute('aria-label', 'Ocultar contraseña');
          btn.classList.add('eye-btn--open');
        }
        function hide() {
          inp.type = 'password';
          btn.setAttribute('aria-label', 'Mostrar contraseña');
          btn.classList.remove('eye-btn--open');
        }

        // Ratón
        btn.addEventListener('mousedown', function (e) { e.preventDefault(); show(); });
        btn.addEventListener('mouseup',   function () { hide(); });
        btn.addEventListener('mouseleave', function () { hide(); });

        // Táctil (móvil)
        btn.addEventListener('touchstart', function (e) { e.preventDefault(); show(); }, { passive: false });
        btn.addEventListener('touchend',    function (e) { e.preventDefault(); hide(); }, { passive: false });
        btn.addEventListener('touchcancel', function () { hide(); });
      })();
    </script>
  </body>
</html>
