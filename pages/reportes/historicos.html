<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reporte de historicos | My Parking Turn</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <script src="../../assets/js/theme.js"></script>
  </head>
  <body>
    <main class="screen screen-main">
      <header class="brand-header" aria-label="Marca My Parking Turn">
        <img class="brand-logo" src="../../assets/img/LOGOMPT.png" alt="Logo My Parking Turn">
        <h1>MY PARKING TURN</h1>
      </header>

      <a class="secondary-action report-link report-return-top" href="../principal.html">VOLVER A REGISTRO DE TURNOS</a>

      <section class="records-panel report-panel" aria-labelledby="report-title">
        <h2 id="report-title">REPORTE DE HISTORICOS</h2>

        <form id="reportFilterForm" class="report-filters">
          <label>
            <span>DESDE</span>
            <input id="startDate" type="date">
          </label>
          <label>
            <span>HASTA</span>
            <input id="endDate" type="date">
          </label>
          <button class="primary-action" type="submit">FILTRAR PERIODO</button>
          <button id="clearReportFilter" class="secondary-action" type="button">VER TODO</button>
        </form>

        <p id="reportMessage" class="form-message" role="alert" aria-live="polite"></p>

        <section class="report-summary" aria-label="Resumen del periodo">
          <article>
            <span>PERIODO</span>
            <strong id="summaryPeriod">TODOS LOS HISTORICOS</strong>
          </article>
          <article>
            <span>NUMERO DE TICKETS</span>
            <strong id="summaryTickets">0</strong>
          </article>
          <article>
            <span>TOTAL COBRADO</span>
            <strong id="summaryTotal">$ 0</strong>
          </article>
        </section>

        <div id="monthlyReports" class="monthly-reports"></div>
      </section>

      <a class="secondary-action report-link" href="../principal.html">VOLVER A TURNOS ACTIVOS</a>
      <button id="logoutButton" class="logout-action" type="button">CERRAR SESION</button>
    </main>

    <div id="deleteModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle" hidden>
      <section class="modal-box">
        <h2 id="deleteModalTitle">ELIMINAR REGISTRO HISTORICO</h2>
        <form id="deleteForm" novalidate>
          <label class="field modal-field">
            <span>CONTRASENA DESARROLLADOR</span>
            <input id="developerPassword" type="password" autocomplete="current-password" required>
          </label>
          <p id="deleteMessage" class="form-message" role="alert" aria-live="polite"></p>
          <div class="modal-actions">
            <button class="secondary-action" type="button" id="cancelDelete">CANCELAR</button>
            <button class="danger-action" type="submit">ELIMINAR</button>
          </div>
        </form>
      </section>
    </div>

    <div id="ticketPreviewModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="ticketPreviewTitle" hidden>
      <section class="modal-box ticket-preview-box">
        <h2 id="ticketPreviewTitle">VISTA DEL TICKET</h2>
        <dl id="ticketPreviewDetails" class="charge-summary ticket-preview-details"></dl>
        <div class="modal-actions"><button id="closeTicketPreview" class="secondary-action" type="button">CERRAR</button></div>
      </section>
    </div>

    <!-- session-guard.js debe ser el PRIMER script: bloquea acceso sin sesion -->
    <script src="../../assets/js/session-guard.js"></script>
    <script src="../../assets/js/storage.js"></script>
    <script src="../../assets/js/ticket-pdf.js"></script>
    <script src="../../assets/js/reportes.js"></script>
  </body>
</html>
